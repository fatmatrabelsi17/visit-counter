# Partie 3 : orchestration Visit-Counter
# Lancement : docker compose up -d --build --scale web=3
# (le "version:" du tuto n'est plus nécessaire avec Docker Compose v2)
services:
  web:
    build: .
    image: ${DOCKERHUB_USER}/counter-app:${IMAGE_TAG}
    environment:
      - APP_PORT=${APP_PORT}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
    # Pas de "ports:" : 3 répliques ne peuvent pas publier le même port hôte.
    # Elles sont seulement joignables sur le réseau interne, via le load balancer.
    expose:
      - "${APP_PORT}"
    depends_on:
      - db-service
    networks:
      - app-network
    restart: unless-stopped

  db-service:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]   # écrit chaque modification sur disque
    volumes:
      - redis-data:/data
    networks:
      - app-network
    restart: unless-stopped

  # Load balancer : point d'entrée unique qui répartit les requêtes entre les répliques "web"
  lb:
    image: nginx:1.27-alpine
    ports:
      - "${HOST_PORT}:80"
    environment:
      - APP_PORT=${APP_PORT}
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - web
    networks:
      - app-network
    restart: unless-stopped

# Remplace le "--link" du tuto : sur un réseau commun, les conteneurs se
# trouvent par leur nom de service (DNS interne de Docker).
networks:
  app-network:
    driver: bridge
    name: app-network

volumes:
  redis-data:
    name: redis-data
